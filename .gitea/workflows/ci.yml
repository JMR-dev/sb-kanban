# Status checks. main requires all three (branch protection contexts
# `ci / static*`, `ci / unit*`, `ci / sb*`). They run the same Makefile stages
# as `make check` locally.
#
#   static  fmt-check, lint, typecheck, build-check   (Lua 5.5.1 tooling)
#   unit    busted on Lua 5.5.1
#   sb      sb-test and e2e against the real, pinned SilverBullet server
#
# Actions are pinned to a full commit SHA with the release in a comment.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.gitea/actions/setup
        with:
          tools: lua luarocks rocks luacheck stylua luals
      - name: Format, lint, types, generated page
        run: make fmt-check lint typecheck build-check

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.gitea/actions/setup
        with:
          tools: lua luarocks rocks
      - name: Unit specs (busted, Lua 5.5.1)
        run: make test

  sb:
    # The Playwright image ships Chromium and its headless shell; the server's
    # Runtime API drives the headless shell (running as root works there).
    # This job uses the committed dist/ page, which `static` checks is
    # current, so it builds no Lua.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-resolute
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.gitea/actions/setup
        with:
          tools: silverbullet
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: pnpm install --frozen-lockfile
      - name: Specs inside SilverBullet, then browser tests
        run: make sb-test e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            .sbtest-tmp/run-*/server.log
          retention-days: 7
